# Ghép với docker-compose.yml khi chạy trên VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Chỉ mở cổng web; CSDL và backend chỉ nói chuyện trong mạng nội bộ của Docker.
# !reset = xoá danh sách cổng; !override = thay bằng danh sách mới (cần Docker Compose ≥ 2.24).
services:
  db:
    ports: !reset []
  backend:
    ports: !reset []
  frontend:
    ports: !override ["${FRONTEND_PORT:-3000}:80"]
