services:
  db:
    image: postgres:16-alpine
    container_name: gymflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gymflow}
      POSTGRES_USER: ${DB_USERNAME:-gymflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gymflow}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gymflow} -d ${DB_NAME:-gymflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: gymflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gymflow}
      DB_USERNAME: ${DB_USERNAME:-gymflow}
      DB_PASSWORD: ${DB_PASSWORD:-gymflow}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-at-least-32-characters-long}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_QUICK_LOGIN: ${DEMO_QUICK_LOGIN:-true}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RESET_EXPOSE_TOKEN: ${RESET_EXPOSE_TOKEN:-true}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    container_name: gymflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
