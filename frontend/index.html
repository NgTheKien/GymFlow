<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141415" />
    <meta name="description" content="GymFlow – phòng tập có huấn luyện viên riêng, lịch tập, giáo án và theo dõi tiến độ. Đăng ký hội viên trực tuyến." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2300b24b'/%3E%3Cpath d='M8 12v8M24 12v8M11 10v12M21 10v12M11 16h10' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Áp chế độ sáng/tối trước khi vẽ trang để không bị nháy màu (khớp src/theme/ThemeContext.tsx)
      (function () {
        var c = "system";
        try { c = localStorage.getItem("gf.theme") || "system"; } catch (e) {}
        var light = c === "light" || (c !== "dark" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
        var t = light ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector("meta[name=theme-color]");
        if (m) m.setAttribute("content", light ? "#f5f6f8" : "#141415");
        try { if (localStorage.getItem("gf.lang") === "en") document.documentElement.lang = "en"; } catch (e) {}
      })();
    </script>
    <title>GymFlow – Tập có kế hoạch. Tiến bộ đo được.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
