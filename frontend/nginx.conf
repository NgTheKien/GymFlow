server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Qua Cloudflare Tunnel, mọi request đến từ container cloudflared (mạng Docker 172.16.0.0/12) nên $remote_addr
    # là IP của tunnel → cả trang chung một hạn mức đăng nhập 10 lần/phút. Lấy IP thật từ CF-Connecting-IP,
    # nhưng chỉ tin header này khi request đi từ mạng Docker; truy cập thẳng cổng 3000 vẫn dùng IP kết nối.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Bảo mật cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host giữ nguyên cả cổng (VD 160.187.229.73:3000). Dùng $host sẽ mất cổng, Spring so
        # Origin của trình duyệt với Host rồi coi mọi POST là cross-origin → 403 "Invalid CORS request".
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi đường dẫn còn lại trả về index.html để react-router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }
}
