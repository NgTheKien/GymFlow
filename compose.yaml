services:
  mysql:
    image: mysql:8.4
    container_name: gymflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gymflow}
      MYSQL_USER: ${MYSQL_USER:-gymflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gymflow_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+07:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - gymflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: gymflow-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gymflow}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-gymflow}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-gymflow_dev_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-at-least-32-characters-long}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_QUICK_LOGIN: ${DEMO_QUICK_LOGIN:-true}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RESET_EXPOSE_TOKEN: ${RESET_EXPOSE_TOKEN:-true}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # Ảnh eclipse-temurin không chắc có wget/curl → dùng /dev/tcp của bash
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: gymflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  gymflow_mysql_data:
